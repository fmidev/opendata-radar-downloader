services:
  fmi-downloader:
    image: ghcr.io/fmidev/opendata-radar-downloader:main
    build: .
    volumes:
      - ./data/fmi:/data
    environment:
      - SOURCE=fmi
      - OUTPUT_DIR=/data
    restart: unless-stopped

  metno-downloader:
    image: ghcr.io/fmidev/opendata-radar-downloader:main
    build: .
    volumes:
      - ./data/metno:/data
    environment:
      - SOURCE=metno
      - OUTPUT_DIR=/data
    restart: unless-stopped

  smhi-downloader:
    image: ghcr.io/fmidev/opendata-radar-downloader:main
    build: .
    volumes:
      - ./data/smhi:/data
    environment:
      - SOURCE=smhi
      - OUTPUT_DIR=/data
    restart: unless-stopped

  dmi-downloader:
    image: ghcr.io/fmidev/opendata-radar-downloader:main
    build: .
    volumes:
      - ./data/dmi:/data
    environment:
      - SOURCE=dmi
      - OUTPUT_DIR=/data
    restart: unless-stopped

  ee-downloader:
    image: ghcr.io/fmidev/opendata-radar-downloader:main
    build: .
    volumes:
      - ./data/ee:/data
    environment:
      - SOURCE=ee
      - OUTPUT_DIR=/data
    restart: unless-stopped

  dwd-downloader:
    image: ghcr.io/fmidev/opendata-radar-downloader:main
    build: .
    volumes:
      - ./data/dwd:/data
    environment:
      - SOURCE=dwd
      - OUTPUT_DIR=/data
    restart: unless-stopped

  chmi-downloader:
    image: ghcr.io/fmidev/opendata-radar-downloader:main
    build: .
    volumes:
      - ./data/chmi:/data
    environment:
      - SOURCE=chmi
      - OUTPUT_DIR=/data
    restart: unless-stopped

  fmi-s3-downloader:
    image: ghcr.io/fmidev/opendata-radar-downloader:main
    build: .
    volumes:
      - ./data/fmi_s3:/data
    environment:
      - SOURCE=fmi_s3
      - FMI_RADARS=fivih,fikor
      - OUTPUT_DIR=/data
    restart: unless-stopped

  dmi-volume-downloader:
    image: ghcr.io/fmidev/opendata-radar-downloader:main
    build: .
    volumes:
      - ./data/dmi_volume:/data
    environment:
      - SOURCE=dmi_volume
      - DMI_RADARS=dkste,dkrom
      - OUTPUT_DIR=/data
    restart: unless-stopped

  smhi-volume-downloader:
    image: ghcr.io/fmidev/opendata-radar-downloader:main
    build: .
    volumes:
      - ./data/smhi_volume:/data
    environment:
      - SOURCE=smhi_volume
      - OUTPUT_DIR=/data
    restart: unless-stopped
